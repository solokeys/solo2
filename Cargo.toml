[workspace]
members = [
    "runners/lpc55",
    "runners/lpc55/board",
    "runners/nrf52840dk",
    "runners/pc",
    "components/ndef-app",
    "components/nfc-device",
    "components/fm11nc08",
    "components/fm11nt082c",
    "components/nrf-nfc",
    "components/provisioner-app",
    "components/oath-export",
    "components/solo-apps",
    "components/wallet-app",
    "components/admin-app",
    "cli",
]
# `cargo run` / `cargo build` / `cargo test` at the workspace root operate on the
# host CLI. `runners/pc` also ships binaries, so the CLI must be the *sole*
# default member for `cargo run` to be unambiguous. Build the firmware explicitly
# with `cargo build -p runner --target thumbv8m.main-none-eabi ...` (or from
# `runners/lpc55/`); test other host members with `cargo test -p <name>`.
default-members = [
    "cli",
]
resolver = "2"

[workspace.package]
version = "2.2362.0"
edition = "2021"
rust-version = "1.94"
authors = [
    "Nicolas Stalder <n@stalder.io>",
    "Conor Patrick <conor@solokeys.com>",
    "Manuel Domke <manuel@leetronics.de>",
]

[workspace.dependencies]
# ── Internal workspace members ────────────────────────────────────────────────
board            = { path = "runners/lpc55/board" }
ndef-app         = { path = "components/ndef-app" }
fm11nc08         = { path = "components/fm11nc08" }
fm11nt082c       = { path = "components/fm11nt082c" }
nfc-device       = { path = "components/nfc-device" }
nrf-nfc          = { path = "components/nrf-nfc" }
provisioner-app  = { path = "components/provisioner-app" }
oath-export      = { path = "components/oath-export" }
solo-apps        = { path = "components/solo-apps" }

# ── RTIC framework ────────────────────────────────────────────────────────────
rtic              = "2.0.0"
rtic-monotonics   = { version = "2.0.0", features = ["cortex-m-systick"] }
rtic-sync         = "1.4.0"
systick-monotonic = "1.0.1"

# ── Cortex-M / embedded ───────────────────────────────────────────────────────
cortex-m      = { version = "0.7.0", features = ["critical-section-single-core"] }
lpc55-hal     = "0.6"
micromath     = "2"
embedded-time = "0.12"
embedded-hal  = { version = "0.2.5", features = ["unproven"] }
spi-memory    = "0.2"

# ── Logging / debug ───────────────────────────────────────────────────────────
defmt      = "1.0.1"
defmt-rtt  = "1.1.0"
delog      = "0.1.1"
panic-halt = "1.0.0"

# ── Core utilities ────────────────────────────────────────────────────────────
heapless    = "0.9"
nb          = "1"
interchange = "0.3"
static_cell = "2.1.1"
ref-swap    = "0.1"
generic-array = "0.14.3"
rand        = "0.8"
rand_core   = "0.6"
serde       = { version = "1", features = ["derive"] }
paste       = "1"
hex         = "0.4"
serde_bytes = "0.11"

# ── USB ───────────────────────────────────────────────────────────────────────
usb-device   = "0.2.3"
usbd-serial  = "0.1.0"
usbd-ccid    = "0.4"
usbd-ctaphid = { version = "0.4", features = ["log-info"] }
chacha20     = { version = "0.7", features = ["rng"] }

# ── APDU / ISO 7816 stack ─────────────────────────────────────────────────────
apdu-dispatch    = "0.4"
ctaphid-dispatch = "0.4"
ctap-types       = "0.6.0-rc.5"
iso7816          = "0.2"
serde_cbor       = { version = "0.11", default-features = false, features = ["std"] }

# ── Storage ───────────────────────────────────────────────────────────────────
littlefs2 = { version = "0.8" }
# lfs.c needs strspn/strcspn/strchr; littlefs2 c-stubs lacks them (as Nitrokey does).
littlefs2-sys = { version = "0.4", features = ["tinyrlibc"] }
tinyrlibc = { version = "0.5", default-features = false, features = ["strcpy"] }

# ── Trussed core ─────────────────────────────────────────────────────────────
trussed      = { version = "0.2", features = ["aes256-gcm", "default-mechanisms"] }
trussed-core = { version = "0.2", features = ["aes256-gcm"] }

# ── Trussed extensions ────────────────────────────────────────────────────────
trussed-staging          = { version = "0.5", features = ["hkdf", "fs-info", "manage", "chunked", "hpke", "wrap-key-to-file"] }
trussed-fs-info          = "0.3"
trussed-hkdf             = "0.4"
trussed-manage           = "0.3"
trussed-chunked          = "0.3"
trussed-hpke             = "0.3"
trussed-wrap-key-to-file = "0.3"
trussed-auth             = "0.5"
trussed-auth-backend     = "0.2"

# ── Applications ─────────────────────────────────────────────────────────────
admin-app          = { path = "components/admin-app" }
fido-authenticator = { version = "=0.4.0-rc.3", features = ["dispatch", "chunked", "credential-id-format-v2"] }
salty              = "0.3"
secrets-app        = { git = "https://github.com/Nitrokey/trussed-secrets-app", tag = "v0.15.0", features = ["apdu-dispatch", "ctaphid", "log-all"] }
# https://github.com/trussed-dev/piv-authenticator/tree/v0.8
piv-authenticator  = { git = "https://github.com/trussed-dev/piv-authenticator", rev = "32636de6177b011f127f88cdf8aae9b2d9cd0ad2", features = ["apdu-dispatch", "mldsa44"] }
opcard             = { git = "https://github.com/Nitrokey/opcard-rs", tag = "v1.8.0", features = ["apdu-dispatch", "delog"] }
wallet-app         = { path = "components/wallet-app", features = ["dispatch", "usbd"] }

# ── PC test-only dependencies ─────────────────────────────────────────────────
serial_test = "3"
# default-features off + static hidraw: shared by runners/pc and the host cli.
hidapi      = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
aes         = "0.8"
cbc         = "0.1"
sha2        = "0.10"
hmac        = "0.12"
cosey       = "0.4"
p256        = { version = "0.13", features = ["ecdh"] }

# ── CLI (host) — used only by the `cli` member ───────────────────────────────
# (hex, sha2, rand_core, p256, iso7816, hidapi are deduped onto the entries above)
anyhow              = "1"
log                 = "0.4"
data-encoding       = "2"
flexiber            = { version = "0.1", features = ["std"] }
getrandom           = "0.2"
hex-literal         = "0.4"
lpc55               = "0.2"
pcsc                = "2"
serde_json          = "1"
sha-1               = "0.10"
time                = "0.3"
x509-parser         = { version = "0.14", features = ["verify"] }
dialoguer           = "0.10"
indicatif           = "0.18"
ureq                = { version = "2", features = ["json"] }
webbrowser          = "1"
clap                = { version = "4", features = ["cargo", "derive"] }
clap_complete       = "4"
clap-verbosity-flag = "2"
ctrlc               = "3"
lazy_static         = "1"
pretty_env_logger   = "0.5"
pkcs8               = { version = "0.10", features = ["alloc"] }
rcgen               = "0.10"
yasna               = "0.6"

# ── Release profile ───────────────────────────────────────────────────────────
[profile.release]
codegen-units = 1
lto           = true
opt-level     = "z"
panic         = "abort"
incremental   = false
debug         = true

[profile.dev]
panic = "abort"

[profile.release.package.salty]
opt-level = 2

# ── Patches ───────────────────────────────────────────────────────────────────
[patch.crates-io]
# https://github.com/solokeys/usbd-ctaphid/tree/v0.5
usbd-ctaphid       = { git = "https://github.com/solokeys/usbd-ctaphid", rev = "dd036376536df970310cf9b6406fb165c881aef1" }
# https://github.com/solokeys/lpc55-hal/tree/v0.7
lpc55-hal          = { git = "https://github.com/solokeys/lpc55-hal", rev = "16e499a7992d3e035424107b8fb09ec9fc9e8d33" }
# https://github.com/solokeys/ctap-types/tree/v0.7
ctap-types         = { git = "https://github.com/solokeys/ctap-types", rev = "3a5bcecb5286630f38dcc3c65a8f500f7abf2d42" }
# https://github.com/solokeys/fido-authenticator/tree/v0.5
fido-authenticator = { git = "https://github.com/solokeys/fido-authenticator", rev = "fae4a1ec8f55d9abe53a7405faf310ef90f3eb71" }
# https://github.com/solokeys/trussed/tree/v0.3
trussed            = { git = "https://github.com/solokeys/trussed", rev = "2ea719b28245f0e68960e99aab16131f7f14d8ff" }
trussed-core       = { git = "https://github.com/solokeys/trussed", rev = "2ea719b28245f0e68960e99aab16131f7f14d8ff" }
# Forked lpc55 (host) with the BCD CalVer-minor>999 version fix, used by the cli.
# https://github.com/solokeys/lpc55-host/tree/v0.3
lpc55 = { git = "https://github.com/solokeys/lpc55-host", rev = "4c57336ef18b804ae3bf9440edf7fc846e2b9a2b" }
# https://github.com/solokeys/apdu-dispatch/tree/v0.5
apdu-dispatch = { git = "https://github.com/solokeys/apdu-dispatch", rev = "730af3a3b0168741a65a2b5f472f99ac5e620216" }
# libcrux-ml-dsa with #[inline(always)] downgraded to #[inline] on the portable
# path — ~80 KB smaller .text on Cortex-M33 (no perf regression), lets all-apps +
# ML-DSA-44 fit on the LPC55. Only ml-dsa is patched; sha3/intrinsics unchanged.
libcrux-ml-dsa = { git = "https://github.com/solokeys/libcrux", rev = "31574b2c2cf5544041ce3be1a72b1c8d3d5d9718" }
