[package]
name = "solo-pc"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "solo_pc"
path = "src/lib.rs"

[[bin]]
name = "solo-pc"
path = "src/bin/main.rs"

# Integration tests reach into `solo_pc::buttons` to drive simulated UP
# (`up::approve()` / `deny()`), so the suite requires the `test-buttons`
# feature. With `--no-default-features` cargo skips this test target
# entirely.
[[test]]
name = "fido2"
path = "tests/fido2.rs"
required-features = ["test-buttons"]

[dependencies]
chacha20.workspace = true
delog.workspace = true
embedded-hal.workspace = true
embedded-time.workspace = true
generic-array.workspace = true
interchange.workspace = true
nb.workspace = true

admin-app.workspace = true
apdu-dispatch.workspace = true
ctap-types.workspace = true
ctaphid-dispatch.workspace = true
fido-authenticator = { workspace = true, optional = true, features = ["mldsa44"] }
piv-authenticator.workspace = true
trussed = { workspace = true, features = ["mldsa44"] }
trussed-core = { workspace = true, features = ["mldsa44"] }

# components
usbd-ccid.workspace = true
usbd-ctaphid.workspace = true
usb-device.workspace = true
nfc-device.workspace = true
ndef-app.workspace = true

# storage
littlefs2.workspace = true

[dev-dependencies]
fido-authenticator = { workspace = true, features = ["mldsa44"] }
# `test-client` adds Serialize impls on CTAP2 Request types and Deserialize
# on Response types — needed by the host-side test harness (we're the
# client). Chip-side builds (above, in [dependencies]) don't enable this.
ctap-types = { workspace = true, features = ["platform-serde"] }
wallet-app = { path = "../../components/wallet-app", default-features = false, features = ["dispatch"] }
iso7816 = { workspace = true }
salty = "0.2"
ctaphid-dispatch.workspace = true
# Host-side CTAP Request → CBOR + Response ← CBOR for the Device backend.
# Same crate ctap-types uses internally to serialize responses.
cbor-smol = "0.5"
heapless = { workspace = true }
rand.workspace = true
serde.workspace = true
serde_cbor.workspace = true
serial_test.workspace = true
paste.workspace = true
hex.workspace = true
# for CTAPHID transport tests against a real device
hidapi.workspace = true
# for PIN encryption helpers
aes.workspace = true
cbc.workspace = true
sha2.workspace = true
hmac.workspace = true
p256.workspace = true
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10", default-features = false }
rand_core.workspace = true
cosey.workspace = true
serde_bytes.workspace = true
# extension backends that fido-authenticator 0.3 requires on the Trussed client
trussed-staging = { workspace = true }
trussed-fs-info.workspace = true
trussed-hkdf.workspace = true
trussed-chunked.workspace = true
trussed-manage.workspace = true
trussed-hpke.workspace = true
trussed-wrap-key-to-file.workspace = true
trussed-auth.workspace = true
trussed-auth-backend.workspace = true

[features]
# Default: simulated buttons + faster wall-clock for Trussed's UP timeout (see `test-fast-up-clock`).
default = ["test-buttons", "test-fast-up-clock"]

# Simulated `Press` + `Edge` (`solo_pc::buttons::TestThreeButtons`): `check_user_presence` polls
# `wait_for_any_new_press` and returns Normal / Strong / None like on-device. FIDO2 tests drive
# approve/deny via `solo_pc::buttons` / `tests/support/up` — UP is still required by the stack.
test-buttons = []

# Scales `UserInterface::uptime()` so Trussed's `RequestUserConsent` reaches fido-authenticator's
# 30 s timeout in ~300 ms real time. Does **not** skip consent or auto-approve; it only speeds the
# platform clock used for that timeout comparison (busy-poll loop stays correct).
test-fast-up-clock = []

# Reconfigure the NFC chip in any case
reconfigure-nfc = []

log-all = []
log-none = []
log-info = []
log-debug = []
log-warn = []
log-error = []
