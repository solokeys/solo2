name: ci

on:
  pull_request:
  push:
    branches:
      - dev
      - main

env:
  CARGO_INCREMENTAL: 0
  # do not set RUSTFLAGES, would overrides .cargo/config (linker script, flip-link)
  UBUNTU_BASE_DEPS: llvm libclang-dev build-essential clang pkg-config libudev-dev
  UBUNTU_LPC55_EXTRA_DEPS: libc6-dev-i386 git
  # apt: bounded retries + network timeout so a mirror stall fails fast instead of hanging
  APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  build-lpc55:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        board:
          - board-lpcxpresso55
          - board-solo2
          # - board-okdoe1
        rust:
          - "1.94.1"
    defaults:
      run:
        working-directory: runners/lpc55
    steps:
      - uses: actions/checkout@v1
      - name: Install littlefs2-sys/micro-ecc-sys build dependencies
        shell: bash
        run: |
          apt-get $APT_OPTS update && apt-get install sudo
          env && pwd && sudo apt-get $APT_OPTS update -y -qq && sudo apt-get install -y -qq $UBUNTU_BASE_DEPS $UBUNTU_LPC55_EXTRA_DEPS
      - uses: fiam/arm-none-eabi-gcc@v1.0.4
        with:
          release: "9-2020-q2"
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          target: thumbv8m.main-none-eabi
          override: true
          components: llvm-tools-preview
      # Use precompiled binutils
      - name: cargo install cargo-binutils
        uses: actions-rs/install@v0.1
        with:
          crate: cargo-binutils
          version: latest
          use-tool-cache: true
      - name: cargo install flip-link
        uses: actions-rs/install@v0.1
        with:
          crate: flip-link
          version: latest
          use-tool-cache: true
      - name: Build
        run: |
          cargo build --release --features ${{ matrix.board }}
      - name: Size
        run: |
          cargo size --release --features ${{ matrix.board }}
      - name: Artifacts for firmware bundle
        run: |
          cargo objcopy --release --features ${{ matrix.board }} -- -O binary firmware-${{ matrix.board }}.bin
          sudo cp *.bin /
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Firmware
          path: runners/lpc55/target/thumbv8m.main-none-eabi/release/runner
      - name: Build Provisioner
        run: |
          cargo build --release --features ${{ matrix.board }},provisioner-app,admin-app,provisioner-app/test-attestation
      - name: Upload Provisioner
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Provisioner
          path: runners/lpc55/target/thumbv8m.main-none-eabi/release/runner


  build-pc:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # TODO: some build issue currently
          # - macos-latest
        rust:
          - "1.94.1"
    defaults:
      run:
        working-directory: runners/pc
    steps:
      - uses: actions/checkout@v1
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          apt-get $APT_OPTS update && apt-get install sudo
          sudo apt $APT_OPTS update -y -qq && sudo apt install -y -qq $UBUNTU_BASE_DEPS

      # this is already installed
      # - name: Install macOS build dependencies
      #   if: matrix.os == 'macos-latest'
      #   shell: bash
      #   run: brew install llvm

      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      - name: Build
        run: cargo build --release

  test-pc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: runners/pc
    steps:
      - uses: actions/checkout@v1
      - name: Install Linux build dependencies
        shell: bash
        run: |
          apt-get $APT_OPTS update && apt-get install sudo
          sudo apt $APT_OPTS update -y -qq && sudo apt install -y -qq $UBUNTU_BASE_DEPS
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: "1.94.1"
          override: true
      - name: Run tests (solo-pc, all targets)
        run: cargo test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v1
      - name: Install Linux build dependencies
        shell: bash
        run: |
          apt-get $APT_OPTS update && apt-get install sudo
          # libpcsclite-dev: `make check` clippy also lints the host cli (pcsc).
          sudo apt $APT_OPTS update -y -qq && sudo apt install -y -qq $UBUNTU_BASE_DEPS $UBUNTU_LPC55_EXTRA_DEPS libpcsclite-dev
      - uses: fiam/arm-none-eabi-gcc@v1.0.4
        with:
          release: "9-2020-q2"
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: "1.94.1"
          target: thumbv8m.main-none-eabi
          override: true
          components: rustfmt, clippy
      - name: make check
        run: make check
